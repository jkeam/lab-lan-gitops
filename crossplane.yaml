apiVersion: v1
kind: Namespace
metadata:
  name: crossplane-system
  annotations:
    openshift.io/description: "Crossplane System"
    openshift.io/display-name: "Crossplane System"
  labels:
    kubernetes.io/metadata.name: crossplane-system
---

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  name: crossplane
  namespace: openshift-gitops
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  source:
    chart: crossplane
    repoURL: https://charts.crossplane.io/stable
    targetRevision: 2.4.3
    helm:
      releaseName: crossplane
      valuesObject:
        securityContextCrossplane:
          runAsUser: null
          runAsGroup: null
        securityContextRBACManager:
          runAsUser: null
          runAsGroup: null
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
