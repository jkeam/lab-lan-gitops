apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  name: finance-app
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: 0
spec:
  destination:
    namespace: finance
    server: https://kubernetes.default.svc
  project: default
  source:
    path: openshift/app
    repoURL: https://github.com/jkeam/finance-web.git
    targetRevision: main
    kustomize:
      namespace: finance
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
